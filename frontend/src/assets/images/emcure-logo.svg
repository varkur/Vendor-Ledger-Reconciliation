  <!-- Horizontal rule line -->
  <line x1="70" y1="70" x2="272" y2="70" stroke="#222" stroke-width="2.5"/>
  <!-- "cure" small -->
  <text x="8" y="105" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#222">cure</text>
